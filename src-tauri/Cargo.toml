[package]
name = "evosuite"
version = "0.1.0"
description = "EvoSuite - 进化与流病分析一体化平台"
authors = ["EvoSuite Team"]
edition = "2021"

[lib]
name = "evosuite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
